<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="shortcut icon" href="imagens/logo-favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./estilos/style.css">
    <link rel="stylesheet" href="./estilos/medea-quiries.css">

</head>
<body>

    <main>
        <section id="login">
            <div id="imagem">
            </div>

            <div id="formulario">
                <h1>Faça Login</h1>
                <p>Seja Bem-vindo(a). Faça seu login para realizar suas compras!</p>
                <form action="./estilos/acessar.js" method="post" autocomplete="on">
                    <div id="mail">
                        <label for="imail">E-mail:</label>
                        <input type="email" name="email" id="imail" size="20" required placeholder=" Digite seu e-mail" maxlength="80" autocomplete="email">
                    </div>

                    <div id="senha">
                        <label for="isenha">Senha:</label>
                        <input type="password" name="senha" id="isenha" required placeholder=" Digite sua senha" maxlength="60" minlength="8" size="20" autocomplete="current-password">
                    </div>

                    <div id="acess">
                        <input type="submit" value="Acessar">
                    </div>

                </form>
            </div>

            <div id="rsenha">
                <a href="#" target="_blank">Redefinir senha</a>
            </div>

        </section>
    </main>
    
</body>
</html>
